name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -Path src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host "::error::version in src-tauri/tauri.conf.json is empty."
            exit 1
          }
          Write-Host "Publishing v$version"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kitchen RO v__VERSION__"
          releaseBody: "Download the Windows setup file below and run it to install."
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"
